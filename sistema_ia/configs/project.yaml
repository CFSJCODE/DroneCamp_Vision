# Caminhos abaixo são relativos à pasta sistema_ia, independentemente do terminal.
schema_version: 1
requested_model: yolo27l.pt
model: yolo26l.pt
task: detect
taxonomy: configs/taxonomy.json
dataset: configs/dataset.yaml
device: cpu
prediction:
  imgsz: 1024
  conf: 0.25
  iou: 0.7
  nms: false
  max_det: 300
training:
  epochs: 100
  imgsz: 1024
  batch: 2
  workers: 0
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  patience: 20
  seed: 42
  deterministic: true
  cache: false
  amp: false
  close_mosaic: 10
  mosaic: 0.5
  mixup: 0.0
  degrees: 10.0
  fliplr: 0.5
  flipud: 0.0
# Piloto: treino real com as revisões humanas de uma única edificação.
# Os pesos só sugerem caixas na revisão; métricas não medem generalização.
pilot:
  model: yolo26l.pt
  suggestion_conf: 0.15
  training:
    epochs: 80
    imgsz: 640
    batch: 4
    patience: 25
    plots: true
